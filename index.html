<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>esp kit wiki</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #000000;
      --card: rgba(10, 10, 12, 0.88);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f0f0f0;
      --text-muted: #a0a0a8;
      --accent: #e0e0e0;
      --accent-soft: rgba(255, 255, 255, 0.1);
      --code-bg: rgba(0, 0, 0, 0.7);
      --code-border: rgba(255, 255, 255, 0.15);
      --radius: 12px;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* ========== STARRY SPACE BACKGROUND ========== */
    .space {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #000;
      overflow: hidden;
    }
    .stars-1 {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 50px 160px, #fff, transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
        radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 200px 50px, #fff, transparent),
        radial-gradient(1px 1px at 250px 180px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 300px 20px, #fff, transparent),
        radial-gradient(1px 1px at 350px 140px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 10px 200px, #fff, transparent),
        radial-gradient(1px 1px at 80px 250px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 180px 220px, #fff, transparent),
        radial-gradient(1px 1px at 280px 90px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 320px 260px, #fff, transparent);
      background-size: 400px 300px;
      background-repeat: repeat;
      opacity: 0.85;
      animation: twinkle 8s ease-in-out infinite alternate;
    }
    .stars-2 {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 60px 90px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 150px 40px, rgba(255,255,255,0.95), transparent),
        radial-gradient(2px 2px at 220px 170px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 80px 210px, rgba(255,255,255,0.9), transparent),
        radial-gradient(2px 2px at 310px 60px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40px 280px, rgba(255,255,255,0.85), transparent),
        radial-gradient(2px 2px at 270px 240px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 190px 300px, rgba(255,255,255,0.9), transparent);
      background-size: 380px 340px;
      background-repeat: repeat;
      opacity: 0.75;
      animation: twinkle 12s ease-in-out infinite alternate-reverse;
    }
    .stars-3 {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2.5px 2.5px at 100px 120px, #fff, transparent),
        radial-gradient(2px 2px at 250px 50px, rgba(255,255,255,0.95), transparent),
        radial-gradient(3px 3px at 50px 250px, #fff, transparent),
        radial-gradient(2px 2px at 340px 180px, rgba(255,255,255,0.9), transparent),
        radial-gradient(2.5px 2.5px at 180px 280px, #fff, transparent),
        radial-gradient(2px 2px at 30px 80px, rgba(255,255,255,0.85), transparent);
      background-size: 420px 360px;
      background-repeat: repeat;
      opacity: 0.65;
      animation: twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.55; }
      to   { opacity: 0.95; }
    }
    .nebula {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(40, 40, 50, 0.2), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgba(30, 30, 40, 0.15), transparent 55%),
        radial-gradient(ellipse 50% 60% at 50% 50%, rgba(25, 25, 30, 0.12), transparent 70%);
      pointer-events: none;
    }
    /* ========== LAYOUT ========== */
    .wrapper {
      max-width: 620px;          /* was 1100px — makes cards much skinnier */
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      position: relative;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem 1rem;
    }
    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    nav a:hover {
      color: #fff;
      background: var(--accent-soft);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;   /* slightly tighter padding */
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .card h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      color: #fff;
      /* removed flex + gap since the dot is gone */
    }
    /* DOT REMOVED — the old .card h2::before rule is deleted */
    .card h3 {
      font-size: 1.05rem;
      margin: 1.25rem 0 0.5rem;
      color: #d0d0d8;
    }
    .card p {
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }
    .card p:last-child {
      margin-bottom: 0;
    }
    /* Inline code */
    code {
      font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      color: #d8d8e0;
      padding: 0.15em 0.4em;
      border-radius: 5px;
      border: 1px solid var(--code-border);
    }
    /* ========== CODE BLOCK + COPY BUTTON ========== */
    .code-block {
      position: relative;
      margin: 0.75rem 0 1rem;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 1rem 2.8rem 1rem 1.15rem;
      overflow-x: auto;
      margin: 0;
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e0e0e8;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 2;
      padding: 0;
    }
    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }
    .copy-btn.copied {
      background: rgba(255, 255, 255, 0.18);
      border-color: #fff;
      color: #fff;
    }
    .copy-btn svg {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .cmd-label {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.35rem;
      opacity: 0.9;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .grid .card {
      margin-bottom: 0;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .corner-text {
      position: fixed;
      bottom: 1.25rem;
      left: 1.25rem;
      z-index: 100;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.45);
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .wrapper {
        padding: 1.25rem 0.9rem 3rem;
      }
      .card {
        padding: 1.1rem 1.15rem;
      }
      .corner-text {
        bottom: 0.75rem;
        left: 0.75rem;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <!-- Space background -->
  <div class="space" aria-hidden="true">
    <div class="nebula"></div>
    <div class="stars-1"></div>
    <div class="stars-2"></div>
    <div class="stars-3"></div>
  </div>
  <!-- BOTTOM LEFT CORNER TEXT -->
  <div class="corner-text">ESP KIT - Best AGENTS.md skills for CS:GO hacks.</div>
  <div class="wrapper">
    <header>
      <h1>ESP-Kit</h1>
      <p>Open-source, AI skills for building hacks in CS:GO</p>
    </header>

    <section id="npm-command" class="card">
      <h2>Installation:</h2>
      <p>
        download both skills:
      </p>
      <div class="code-block">
        <button class="copy-btn" type="button" title="Copy" aria-label="Copy to clipboard">
          <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <pre><code>npm install csgo-esp-kit</code></pre>
      </div>
    </section>
  </div>
  <script>
    document.querySelectorAll('.copy-btn').forEach(button => {
      button.addEventListener('click', async () => {
        const codeBlock = button.closest('.code-block');
        const code = codeBlock.querySelector('code').innerText;
        const iconCopy = button.querySelector('.icon-copy');
        const iconCheck = button.querySelector('.icon-check');
        try {
          await navigator.clipboard.writeText(code);
          button.classList.add('copied');
          iconCopy.style.display = 'none';
          iconCheck.style.display = 'block';
          setTimeout(() => {
            button.classList.remove('copied');
            iconCopy.style.display = 'block';
            iconCheck.style.display = 'none';
          }, 1500);
        } catch (err) {}
      });
    });
  </script>
</body>
</html>
